<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参宿四 · Betelgeuse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: rgba(255,255,255,0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ff5533;
            text-shadow: 0 0 18px rgba(255,70,40,1), 0 0 50px rgba(200,40,20,0.7), 0 2px 0 rgba(0,0,0,0.9);
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #dd3322;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(220,50,30,0.9);
        }

        .instruction {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(25,8,5,0.85);
            border: 1px solid rgba(255,80,50,0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid rgba(255,90,50,0.9);
            color: rgba(255,200,170,0.78);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(25,8,5,0.85);
            border: 1px solid rgba(255,80,50,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: rgba(255,190,160,0.72);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info b {
            color: #ff7755;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: rgba(255,120,80,0.9);
            font-size: 20px;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="loading">正在膨胀红超巨星...</div>

    <div id="ui-layer">
        <h1>参宿四</h1>
        <div class="subtitle">BETELGEUSE · 红超巨星</div>
        <div class="instruction">
            🖱️ <b>拖拽</b>: 旋转视角<br>
            🔍 <b>滚轮</b>: 缩放距离
        </div>
        <div class="info">
            <b>类型</b>: M1-2 Ia-ab 红超巨星<br>
            <b>距离</b>: 约 548 光年<br>
            <b>表面温度</b>: ~3,500 K<br>
            <b>半径</b>: ~724 倍太阳半径<br>
            <b>状态</b>: 脉动变星，临近超新星
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 配置
        // ==========================================
        const CONFIG = {
            starRadius: 55,               // 红超巨星本体
            chromosphereRadius: 65,       // 色球层
            coronaInnerRadius: 78,        // 内冕
            coronaOuterRadius: 110,       // 外冕
            windParticleCount: 30000,    // 恒星风粒子（大量物质抛射）
            orbitParticleCount: 30000,  // 轨道粒子
            bowShockCount: 15000,        // 弓形激波粒子
            starCount: 4000,
        };

        let scene, camera, renderer, composer, controls;
        let starSurface, chromosphere, coronaInner, coronaOuter;
        let windParticles, windData = null;
        let orbitParticles, orbitData = null;
        let bowShockParticles, bowShockData = null;
        let starfield;
        let bloomPass;
        let time = 0;

        const loadingEl = document.getElementById('loading');

        // ==========================================
        // 粒子纹理
        // ==========================================
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0,   'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            g.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 红超巨星表面纹理 — M1Ia参宿四
        // ==========================================
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 基底渐变：深红→红橙→暗红
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0,    '#992211');
            grad.addColorStop(0.12, '#bb3311');
            grad.addColorStop(0.3,  '#cc4422');
            grad.addColorStop(0.5,  '#dd5533');
            grad.addColorStop(0.7,  '#cc4422');
            grad.addColorStop(0.88, '#bb3311');
            grad.addColorStop(1,    '#992211');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            // 巨大对流胞（红超巨星特征 — 直径可达几十倍恒星本身）
            for (let i = 0; i < 80; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const rx = Math.random() * 70 + 30;
                const ry = Math.random() * 50 + 25;
                const alpha = Math.random() * 0.35 + 0.1;
                const bright = Math.random() > 0.45;
                const cellGrad = ctx.createRadialGradient(x, y, 0, x, y, rx);
                if (bright) {
                    cellGrad.addColorStop(0, `rgba(255,150,80,${alpha})`);
                    cellGrad.addColorStop(0.5, `rgba(220,110,50,${alpha*0.5})`);
                    cellGrad.addColorStop(1, 'rgba(180,60,20,0)');
                } else {
                    cellGrad.addColorStop(0, `rgba(120,30,10,${alpha})`);
                    cellGrad.addColorStop(0.5, `rgba(140,40,15,${alpha*0.4})`);
                    cellGrad.addColorStop(1, 'rgba(140,40,15,0)');
                }
                ctx.fillStyle = cellGrad;
                ctx.beginPath();
                ctx.ellipse(x, y, rx, ry, Math.random() * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 大型暗斑（2019-2020大变暗事件特征）
            // 主大暗斑
            const dsX = 400, dsY = 280;
            const dsGrad = ctx.createRadialGradient(dsX, dsY, 0, dsX, dsY, 80);
            dsGrad.addColorStop(0, 'rgba(20,5,2,0.9)');
            dsGrad.addColorStop(0.4, 'rgba(50,15,5,0.6)');
            dsGrad.addColorStop(0.7, 'rgba(90,30,10,0.3)');
            dsGrad.addColorStop(1, 'rgba(120,40,15,0)');
            ctx.fillStyle = dsGrad;
            ctx.beginPath();
            ctx.ellipse(dsX, dsY, 80, 60, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // 次级暗斑
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * 1024;
                const y = 60 + Math.random() * 392;
                const rx = Math.random() * 35 + 20;
                const ry = rx * (0.6 + Math.random() * 0.4);
                const spotGrad = ctx.createRadialGradient(x, y, 0, x, y, rx * 1.5);
                spotGrad.addColorStop(0, 'rgba(25,8,3,0.8)');
                spotGrad.addColorStop(0.5, 'rgba(60,20,8,0.45)');
                spotGrad.addColorStop(0.8, 'rgba(100,35,12,0.18)');
                spotGrad.addColorStop(1, 'rgba(130,45,15,0)');
                ctx.fillStyle = spotGrad;
                ctx.beginPath();
                ctx.ellipse(x, y, rx * 1.5, ry * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 亮斑（对流胞上涌区）
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const rx = Math.random() * 25 + 15;
                const flareGrad = ctx.createRadialGradient(x, y, 0, x, y, rx);
                flareGrad.addColorStop(0, 'rgba(255,180,100,0.5)');
                flareGrad.addColorStop(0.5, 'rgba(220,120,60,0.25)');
                flareGrad.addColorStop(1, 'rgba(200,80,30,0)');
                ctx.fillStyle = flareGrad;
                ctx.beginPath();
                ctx.arc(x, y, rx, 0, Math.PI * 2);
                ctx.fill();
            }

            // 细微颗粒
            for (let i = 0; i < 12000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const size = Math.random() * 2 + 0.5;
                const brightness = Math.random() * 0.2 + 0.05;
                const hue = 5 + Math.random() * 15;
                const sat = 80 + Math.random() * 20;
                const light = 40 + Math.random() * 30;
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 初始化
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 35, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 鼠标控制
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.6;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 90;
            controls.maxDistance = 1500;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;

            // 后期处理 — Bloom
            const renderPass = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                3.0, 0.6, 0.0
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const tex = createParticleTexture();

            // 光源
            const starLight = new THREE.PointLight(0xff4422, 3.5, 1500);
            scene.add(starLight);
            const ambient = new THREE.AmbientLight(0x220505, 0.3);
            scene.add(ambient);

            // --- 恒星表面 ---
            const starTex = createStarTexture();
            starSurface = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.starRadius, 96, 96),
                new THREE.MeshBasicMaterial({
                    map: starTex,
                    color: 0xffffff
                })
            );
            scene.add(starSurface);

            // --- 色球层 ---
            chromosphere = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.chromosphereRadius, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0xff3322,
                    transparent: true,
                    opacity: 0.38,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending
                })
            );
            scene.add(chromosphere);

            // --- 内冕 ---
            coronaInner = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.coronaInnerRadius, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0xff5533,
                    transparent: true,
                    opacity: 0.2,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending
                })
            );
            scene.add(coronaInner);

            // --- 外冕 ---
            coronaOuter = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.coronaOuterRadius, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0xff7744,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending
                })
            );
            scene.add(coronaOuter);

            // --- 恒星风粒子 ---
            windParticles = createWindParticles(tex);
            scene.add(windParticles);

            // --- 弓形激波 ---
            bowShockParticles = createBowShock(tex);
            scene.add(bowShockParticles);

            // --- 轨道粒子 ---
            orbitParticles = createOrbitParticles(tex);
            scene.add(orbitParticles);

            // --- 星空背景 ---
            starfield = createStarfield();
            scene.add(starfield);

            // 用户交互时暂停自动旋转
            renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });

            window.addEventListener('resize', onResize);

            loadingEl.style.display = 'none';
        }

        // ==========================================
        // 恒星风粒子 — 大量物质抛射
        // ==========================================
        function createWindParticles(texture) {
            const count = CONFIG.windParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            windData = {
                dirs: new Float32Array(count * 3),
                speeds: new Float32Array(count),
                phases: new Float32Array(count),
                maxDist: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const dirX = Math.sin(phi) * Math.cos(theta);
                const dirY = Math.sin(phi) * Math.sin(theta);
                const dirZ = Math.cos(phi);

                const r = CONFIG.starRadius + Math.random() * 8;

                positions[i * 3]     = r * dirX;
                positions[i * 3 + 1] = r * dirY;
                positions[i * 3 + 2] = r * dirZ;

                windData.dirs[i * 3]     = dirX;
                windData.dirs[i * 3 + 1] = dirY;
                windData.dirs[i * 3 + 2] = dirZ;
                windData.speeds[i] = 0.1 + Math.random() * 0.3;
                windData.phases[i] = Math.random() * Math.PI * 2;
                windData.maxDist[i] = 140 + Math.random() * 200;

                // 红橙色调
                const hueVar = Math.random();
                colors[i * 3]     = 0.85 + hueVar * 0.15;
                colors[i * 3 + 1] = 0.25 + hueVar * 0.25;
                colors[i * 3 + 2] = 0.08 + hueVar * 0.08;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.8, map: texture, vertexColors: true, transparent: true,
                opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 弓形激波 — 参宿四穿越星际介质的特征
        // ==========================================
        function createBowShock(texture) {
            const count = CONFIG.bowShockCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            bowShockData = {
                baseAngles: new Float32Array(count),
                radii: new Float32Array(count),
                phases: new Float32Array(count),
                thicknessOffsets: new Float32Array(count),
            };

            // 弓形激波：在恒星运动方向前方形成弧形结构
            const shockDist = 200;  // 激波距恒星距离
            const shockSpread = 250; // 激波弧面宽度

            for (let i = 0; i < count; i++) {
                // 弓形分布：偏向一个半球
                const angle = (Math.random() - 0.5) * Math.PI * 1.6;  // -144° ~ +144°
                const radiusVar = 0.85 + Math.random() * 0.3;
                const r = shockDist * radiusVar;

                // 弓形弯曲：角度越大，距离越远
                const arcRadius = r * (1 + Math.abs(angle) * 0.3);

                // 弓面在 xz 平面上，偏 -z 方向（恒星运动方向）
                const x = arcRadius * Math.sin(angle);
                const z = -arcRadius * Math.cos(angle);
                const y = (Math.random() - 0.5) * shockSpread * (0.3 + Math.abs(Math.cos(angle)) * 0.7);

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                bowShockData.baseAngles[i] = angle;
                bowShockData.radii[i] = r;
                bowShockData.phases[i] = Math.random() * Math.PI * 2;
                bowShockData.thicknessOffsets[i] = Math.random();

                // 颜色：偏红橙
                const v = Math.random();
                colors[i * 3]     = 0.7 + v * 0.3;
                colors[i * 3 + 1] = 0.2 + v * 0.2;
                colors[i * 3 + 2] = 0.06 + v * 0.06;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 3.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 轨道粒子
        // ==========================================
        function createOrbitParticles(texture) {
            const count = CONFIG.orbitParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            orbitData = {
                semiMajors: new Float32Array(count),
                semiMinors: new Float32Array(count),
                inclinations: new Float32Array(count),
                longitudes: new Float32Array(count),
                baseAngles: new Float32Array(count),
                speeds: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const a = 180 + Math.random() * 280;
                const ecc = 0.08 + Math.random() * 0.35;
                const b = a * (1 - ecc);
                const inc = (Math.random() - 0.5) * 0.5;
                const lon = Math.random() * Math.PI * 2;
                const angle = Math.random() * Math.PI * 2;

                orbitData.semiMajors[i] = a;
                orbitData.semiMinors[i] = b;
                orbitData.inclinations[i] = inc;
                orbitData.longitudes[i] = lon;
                orbitData.baseAngles[i] = angle;
                orbitData.speeds[i] = 0.08 * Math.sqrt(180 / a) * 0.35;

                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                let x = a * cosA;
                let z = b * sinA;
                let y = 0;
                const cosI = Math.cos(inc);
                const sinI = Math.sin(inc);
                const ny = y * cosI - z * sinI;
                const nz = y * sinI + z * cosI;
                y = ny; z = nz;
                const cosL = Math.cos(lon);
                const sinL = Math.sin(lon);
                const nx = x * cosL - z * sinL;
                const nz2 = x * sinL + z * cosL;
                x = nx; z = nz2;

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                const t = Math.random();
                colors[i * 3]     = 0.75 + t * 0.25;
                colors[i * 3 + 1] = 0.2 + t * 0.22;
                colors[i * 3 + 2] = 0.06 + t * 0.08;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 星空背景
        // ==========================================
        function createStarfield() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const count = CONFIG.starCount;
            for (let i = 0; i < count; i++) {
                const r = 800 + Math.random() * 1500;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xffffff, size: 1.5, transparent: true,
                opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false
            }));
        }

        // ==========================================
        // 窗口适配
        // ==========================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 动画循环
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            // 恒星自转
            if (starSurface) {
                starSurface.rotation.y += 0.002;
            }

            // 脉动变星效果 — 参宿四是不规则脉动变星
            if (starSurface) {
                const pulse = 1 + Math.sin(time * 0.6) * 0.04 + Math.sin(time * 0.27) * 0.03;
                starSurface.scale.set(pulse, pulse, pulse);
            }

            // 色球层脉动
            if (chromosphere) {
                const pulse = 1 + Math.sin(time * 1.8) * 0.025;
                chromosphere.scale.set(pulse, pulse, pulse);
                chromosphere.material.opacity = 0.35 + Math.sin(time * 1.5) * 0.05;
            }

            // 内冕呼吸
            if (coronaInner) {
                const pulse = 1 + Math.sin(time * 1.3) * 0.03;
                coronaInner.scale.set(pulse, pulse, pulse);
                coronaInner.material.opacity = 0.18 + Math.sin(time * 2) * 0.04;
            }

            // 外冕呼吸
            if (coronaOuter) {
                const pulse = 1 + Math.sin(time * 1.0) * 0.035;
                coronaOuter.scale.set(pulse, pulse, pulse);
                coronaOuter.material.opacity = 0.09 + Math.sin(time * 1.3) * 0.03;
            }

            // 恒星风粒子运动
            if (windParticles && windData) {
                const posAttr = windParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = windData.speeds.length;

                for (let i = 0; i < n; i++) {
                    const idx = i * 3;
                    const phase = (time * windData.speeds[i] + windData.phases[i]) % 1.0;
                    const dist = CONFIG.starRadius + phase * windData.maxDist[i];

                    arr[idx]     = windData.dirs[idx] * dist;
                    arr[idx + 1] = windData.dirs[idx + 1] * dist;
                    arr[idx + 2] = windData.dirs[idx + 2] * dist;
                }
                posAttr.needsUpdate = true;
            }

            // 弓形激波微妙抖动
            if (bowShockParticles && bowShockData) {
                const posAttr = bowShockParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = bowShockData.baseAngles.length;

                for (let i = 0; i < n; i++) {
                    const angle = bowShockData.baseAngles[i];
                    const r = bowShockData.radii[i];
                    const arcRadius = r * (1 + Math.abs(angle) * 0.3);
                    const wobble = Math.sin(time * 0.5 + bowShockData.phases[i]) * 3 * bowShockData.thicknessOffsets[i];

                    arr[i * 3]     = arcRadius * Math.sin(angle) + wobble;
                    arr[i * 3 + 1] = arr[i * 3 + 1]; // y保持不变
                    arr[i * 3 + 2] = -arcRadius * Math.cos(angle) + wobble * 0.5;
                }
                posAttr.needsUpdate = true;
            }

            // 轨道粒子运动
            if (orbitParticles && orbitData) {
                const posAttr = orbitParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = orbitData.semiMajors.length;

                for (let i = 0; i < n; i++) {
                    const ang = orbitData.baseAngles[i] + time * orbitData.speeds[i];
                    const a = orbitData.semiMajors[i];
                    const b = orbitData.semiMinors[i];
                    const inc = orbitData.inclinations[i];
                    const lon = orbitData.longitudes[i];

                    const cosA = Math.cos(ang);
                    const sinA = Math.sin(ang);
                    let x = a * cosA;
                    let z = b * sinA;
                    let y = 0;

                    const cosI = Math.cos(inc);
                    const sinI = Math.sin(inc);
                    const ny = y * cosI - z * sinI;
                    const nz = y * sinI + z * cosI;
                    y = ny; z = nz;

                    const cosL = Math.cos(lon);
                    const sinL = Math.sin(lon);
                    const nx = x * cosL - z * sinL;
                    const nz2 = x * sinL + z * cosL;
                    x = nx; z = nz2;

                    arr[i * 3]     = x;
                    arr[i * 3 + 1] = y;
                    arr[i * 3 + 2] = z;
                }
                posAttr.needsUpdate = true;
            }

            // 星空缓慢旋转
            if (starfield) starfield.rotation.y += 0.0002;

            controls.update();
            composer.render();
        }

        // ==========================================
        // 启动
        // ==========================================
        init();
        animate();

    </script>
</body>
</html>
