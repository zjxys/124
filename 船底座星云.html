<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船底座星云 · Carina Nebula (NGC 3372)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: rgba(255,255,255,0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffaa55;
            text-shadow: 0 0 18px rgba(200,130,40,1), 0 0 50px rgba(150,80,20,0.5), 0 2px 0 rgba(0,0,0,0.9);
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #cc8833;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(160,90,20,0.9);
        }

        .instruction {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(15,10,5,0.85);
            border: 1px solid rgba(220,150,50,0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid rgba(230,160,60,0.9);
            color: rgba(240,210,170,0.78);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(15,10,5,0.85);
            border: 1px solid rgba(220,150,50,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: rgba(230,200,160,0.72);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info b {
            color: #eebb55;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: rgba(220,150,50,0.9);
            font-size: 20px;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="loading">正在照亮恒星摇篮...</div>

    <div id="ui-layer">
        <h1>Carina Nebula</h1>
        <div class="subtitle">NGC 3372 · 船底座星云</div>
        <div class="instruction">
            🖱️ <b>拖拽</b>: 旋转视角<br>
            🔍 <b>滚轮</b>: 缩放距离
        </div>
        <div class="info">
            <b>类型</b>: 发射星云 / HII 区<br>
            <b>距离</b>: ~7,500 光年（船底座）<br>
            <b>直径</b>: ~300 光年<br>
            <b>年龄</b>: ~300 万年<br>
            <b>特征</b>: 海山二 / 双极星云 / 巨型尘埃柱 / 钥匙孔星云
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const CONFIG = {
            // 海山二 (Eta Carinae) — 中心最亮星
            etaCarRadius: 6,
            etaCarGlow1: 15,
            etaCarGlow2: 35,
            etaCarGlow3: 60,
            // Homunculus 双极星云
            homunculusLength: 50,
            homunculusRadius: 20,

            // 星团
            clusterStars: [
                { pos: [0, 0, 0],     radius: 6, color: 0xffddaa, glowColor: 0xffaa55 },  // Eta Car
                { pos: [40, 20, -10], radius: 4, color: 0xddeeff, glowColor: 0xaaccff },
                { pos: [-30, -15, 15], radius: 3.5, color: 0xddeeff, glowColor: 0xaaccff },
                { pos: [25, -25, 20], radius: 3, color: 0xaaccff, glowColor: 0x88aaff },
                { pos: [-20, 30, -15], radius: 3, color: 0xffeecc, glowColor: 0xffcc88 },
                { pos: [50, 5, 10],   radius: 2.5, color: 0xddeeff, glowColor: 0xaaccff },
                { pos: [-45, 10, -5], radius: 2.5, color: 0xddeeff, glowColor: 0xaaccff },
            ],
            // 星云参数
            nebulaRadius: 180,
            // 尘埃柱
            pillarCount: 5,
            // 粒子数量
            gasCount: 100000,
            pillarCount2: 25000,
            dustCount: 15000,
            haloCount: 10000,
            bgStarCount: 5000,
            tiltX: 0.15,
            tiltZ: -0.05,
        };

        let scene, camera, renderer, composer, controls;
        let nebulaGroup;
        let clusterMeshes = [], clusterGlows = [];
        let homunculusParticles1, homunculusParticles2;
        let gasParticles, gasData = null;
        let pillarGroup;
        let dustParticles, dustData = null;
        let haloParticles, haloData = null;
        let bgStarfield;
        let bloomPass;
        let time = 0;

        const loadingEl = document.getElementById('loading');

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        function noise3D(x, y, z) {
            return Math.sin(x * 0.03) * Math.cos(y * 0.04) * Math.sin(z * 0.035)
                 + Math.sin(x * 0.08 + 1) * Math.cos(y * 0.07 + 2) * Math.sin(z * 0.06 + 3) * 0.5
                 + Math.sin(x * 0.15 + 4) * Math.cos(y * 0.13 + 5) * Math.sin(z * 0.11 + 6) * 0.25;
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.00012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 50, 400);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.6;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 50;
            controls.maxDistance = 1800;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.2;

            const renderPass = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                2.2, 0.6, 0.0
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const tex = createParticleTexture();

            const coreLight = new THREE.PointLight(0xffaa66, 4.0, 600);
            scene.add(coreLight);
            const ambient = new THREE.AmbientLight(0x0a0805, 0.3);
            scene.add(ambient);

            nebulaGroup = new THREE.Group();
            nebulaGroup.rotation.x = CONFIG.tiltX;
            nebulaGroup.rotation.z = CONFIG.tiltZ;
            scene.add(nebulaGroup);

            // === 星团 + 海山二 ===
            for (const starDef of CONFIG.clusterStars) {
                const star = new THREE.Mesh(
                    new THREE.SphereGeometry(starDef.radius, 24, 24),
                    new THREE.MeshBasicMaterial({ color: starDef.color })
                );
                star.position.set(starDef.pos[0], starDef.pos[1], starDef.pos[2]);
                nebulaGroup.add(star);
                clusterMeshes.push(star);

                for (let g = 0; g < 3; g++) {
                    const glowR = starDef.radius * (2.5 + g * 2.5);
                    const glow = new THREE.Mesh(
                        new THREE.SphereGeometry(glowR, 24, 24),
                        new THREE.MeshBasicMaterial({
                            color: starDef.glowColor, transparent: true,
                            opacity: g === 0 ? 0.4 : (g === 1 ? 0.12 : 0.04),
                            blending: THREE.AdditiveBlending, side: THREE.BackSide
                        })
                    );
                    glow.position.copy(star.position);
                    nebulaGroup.add(glow);
                    clusterGlows.push(glow);
                }
            }

            // === Homunculus 双极星云（海山二 1840 年大爆发产物）===
            const homun = createHomunculus(tex);
            nebulaGroup.add(homun.jet1);
            nebulaGroup.add(homun.jet2);
            homunculusParticles1 = homun.jet1;
            homunculusParticles2 = homun.jet2;

            // === 气体粒子 ===
            gasParticles = createGasParticles(tex);
            nebulaGroup.add(gasParticles);

            // === 尘埃柱 ===
            pillarGroup = createPillars(tex);
            nebulaGroup.add(pillarGroup);

            // === 暗尘埃云 ===
            dustParticles = createDustCloud(tex);
            nebulaGroup.add(dustParticles);

            // === 外晕 ===
            haloParticles = createHaloParticles(tex);
            nebulaGroup.add(haloParticles);

            // === 背景星空 ===
            bgStarfield = createBgStarfield();
            scene.add(bgStarfield);

            renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
            window.addEventListener('resize', onResize);

            loadingEl.style.display = 'none';
        }

        // ==========================================
        // Homunculus 双极星云 — 海山二大爆发抛射物
        // ==========================================
        function createHomunculus(texture) {
            const countPerLobe = 8000;

            const geo1 = new THREE.BufferGeometry();
            const pos1 = new Float32Array(countPerLobe * 3);
            const col1 = new Float32Array(countPerLobe * 3);

            const geo2 = new THREE.BufferGeometry();
            const pos2 = new Float32Array(countPerLobe * 3);
            const col2 = new Float32Array(countPerLobe * 3);

            for (let i = 0; i < countPerLobe; i++) {
                for (let jet = 0; jet < 2; jet++) {
                    const lobe = jet === 0 ? 1 : -1;
                    const t = Math.pow(Math.random(), 0.4);
                    const dist = t * CONFIG.homunculusLength;
                    const angle = Math.random() * Math.PI * 2;
                    const radius = CONFIG.homunculusRadius * (0.2 + t * 0.8);

                    const x = Math.cos(angle) * radius;
                    const y = lobe * dist;
                    const z = Math.sin(angle) * radius * 0.6;

                    // 噪声
                    const n = noise3D(x, y, z) * 3;
                    const fx = x + n;
                    const fy = y + n * 0.5;
                    const fz = z + n * 0.5;

                    if (jet === 0) {
                        pos1[i * 3] = fx; pos1[i * 3 + 1] = fy; pos1[i * 3 + 2] = fz;
                    } else {
                        pos2[i * 3] = fx; pos2[i * 3 + 1] = fy; pos2[i * 3 + 2] = fz;
                    }

                    // 橙棕色 — Homunculus 的颜色
                    const intensity = (1 - t * 0.4) * (0.4 + Math.random() * 0.5);
                    const r_col = 0.8 * intensity;
                    const g_col = 0.45 * intensity;
                    const b_col = 0.2 * intensity;

                    if (jet === 0) {
                        col1[i * 3] = r_col; col1[i * 3 + 1] = g_col; col1[i * 3 + 2] = b_col;
                    } else {
                        col2[i * 3] = r_col; col2[i * 3 + 1] = g_col; col2[i * 3 + 2] = b_col;
                    }
                }
            }

            geo1.setAttribute('position', new THREE.BufferAttribute(pos1, 3));
            geo1.setAttribute('color', new THREE.BufferAttribute(col1, 3));
            geo2.setAttribute('position', new THREE.BufferAttribute(pos2, 3));
            geo2.setAttribute('color', new THREE.BufferAttribute(col2, 3));

            const mat = new THREE.PointsMaterial({
                size: 3.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            });

            return {
                jet1: new THREE.Points(geo1, mat),
                jet2: new THREE.Points(geo2, mat.clone()),
            };
        }

        // ==========================================
        // 气体粒子 — 多色发射星云
        // ==========================================
        function createGasParticles(texture) {
            const count = CONFIG.gasCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            gasData = {
                basePos: new Float32Array(count * 3),
                phases: new Float32Array(count),
                speeds: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                let x, y, z, density;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * CONFIG.nebulaRadius * 2;
                    y = (Math.random() - 0.5) * CONFIG.nebulaRadius * 1.5;
                    z = (Math.random() - 0.5) * CONFIG.nebulaRadius * 2;
                    density = noise3D(x, y, z);
                    attempts++;
                } while (density < -0.15 && attempts < 5);

                const dist = Math.sqrt(x*x + y*y + z*z);
                const distFactor = dist / CONFIG.nebulaRadius;

                if (distFactor > 1.0 && Math.random() > (1.0 / distFactor) * 0.3) {
                    i--;
                    continue;
                }

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                gasData.basePos[i * 3]     = x;
                gasData.basePos[i * 3 + 1] = y;
                gasData.basePos[i * 3 + 2] = z;
                gasData.phases[i] = Math.random() * Math.PI * 2;
                gasData.speeds[i] = 0.06 + Math.random() * 0.2;

                // 颜色：按噪声和距离
                const noiseVal = noise3D(x * 1.5, y * 1.5, z * 1.5);
                let r, g, b;

                if (noiseVal > 0.3) {
                    // H-alpha 红粉色
                    r = 0.9 + Math.random() * 0.1;
                    g = 0.15 + Math.random() * 0.12;
                    b = 0.2 + Math.random() * 0.1;
                } else if (noiseVal > -0.05) {
                    // OIII 绿色
                    r = 0.2 + Math.random() * 0.15;
                    g = 0.65 + Math.random() * 0.2;
                    b = 0.4 + Math.random() * 0.15;
                } else if (noiseVal > -0.3) {
                    // 反射星云蓝色
                    r = 0.2 + Math.random() * 0.1;
                    g = 0.35 + Math.random() * 0.15;
                    b = 0.75 + Math.random() * 0.2;
                } else {
                    // 橙色 — 靠近海山二区域
                    r = 0.75 + Math.random() * 0.15;
                    g = 0.35 + Math.random() * 0.15;
                    b = 0.12 + Math.random() * 0.08;
                }

                const brightness = (1.0 - distFactor * 0.5) * (0.35 + Math.random() * 0.6);
                colors[i * 3]     = r * brightness;
                colors[i * 3 + 1] = g * brightness;
                colors[i * 3 + 2] = b * brightness;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 3.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 尘埃柱 — Mystic Mountain 风格的垂直尘埃结构
        // ==========================================
        function createPillars(texture) {
            const group = new THREE.Group();
            const totalPillars = CONFIG.pillarCount;
            const particlesPerPillar = Math.floor(CONFIG.pillarCount2 / totalPillars);

            for (let p = 0; p < totalPillars; p++) {
                const geo = new THREE.BufferGeometry();
                const positions = new Float32Array(particlesPerPillar * 3);
                const colors = new Float32Array(particlesPerPillar * 3);

                // 柱的位置
                const px = (Math.random() - 0.5) * CONFIG.nebulaRadius * 1.2;
                const pz = (Math.random() - 0.5) * CONFIG.nebulaRadius * 1.2;
                const pyBase = -40 + Math.random() * 20;
                const pillarHeight = 60 + Math.random() * 80;
                const pillarWidth = 15 + Math.random() * 15;

                for (let i = 0; i < particlesPerPillar; i++) {
                    const t = Math.random();
                    const height = t * pillarHeight;
                    const width = pillarWidth * (1 - t * 0.5);  // 越往上越窄

                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * width;
                    const ox = Math.cos(angle) * r;
                    const oz = Math.sin(angle) * r;

                    const x = px + ox + noise3D(ox, height, oz) * 5;
                    const y = pyBase + height + noise3D(x, height, oz) * 3;
                    const z = pz + oz + noise3D(x, height, oz) * 5;

                    positions[i * 3]     = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    // 暗褐色尘埃，顶部略亮（被恒星照亮）
                    const topFactor = t;
                    const brightness = (0.04 + topFactor * 0.1) * (0.5 + Math.random() * 0.5);
                    colors[i * 3]     = brightness * (0.6 + topFactor * 0.3);
                    colors[i * 3 + 1] = brightness * (0.35 + topFactor * 0.15);
                    colors[i * 3 + 2] = brightness * 0.15;

                    // 顶部有时有亮色边缘
                    if (topFactor > 0.85 && Math.random() > 0.7) {
                        colors[i * 3]     = brightness * 0.8;
                        colors[i * 3 + 1] = brightness * 0.6;
                        colors[i * 3 + 2] = brightness * 0.3;
                    }
                }

                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const pillar = new THREE.Points(geo, new THREE.PointsMaterial({
                    size: 3.0, map: texture, vertexColors: true, transparent: true,
                    opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false,
                    sizeAttenuation: true
                }));
                group.add(pillar);
            }

            return group;
        }

        // ==========================================
        // 暗尘埃云 — Keyhole Nebula 风格
        // ==========================================
        function createDustCloud(texture) {
            const count = CONFIG.dustCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            dustData = {
                basePos: new Float32Array(count * 3),
                phases: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                // 分布在中部区域
                const x = (Math.random() - 0.5) * CONFIG.nebulaRadius * 0.8;
                const y = (Math.random() - 0.5) * CONFIG.nebulaRadius * 0.5;
                const z = (Math.random() - 0.5) * CONFIG.nebulaRadius * 0.8;

                const n = noise3D(x * 2, y * 2, z * 2) * 8;

                positions[i * 3]     = x + n;
                positions[i * 3 + 1] = y + n * 0.5;
                positions[i * 3 + 2] = z + n;

                dustData.basePos[i * 3]     = positions[i * 3];
                dustData.basePos[i * 3 + 1] = positions[i * 3 + 1];
                dustData.basePos[i * 3 + 2] = positions[i * 3 + 2];
                dustData.phases[i] = Math.random() * Math.PI * 2;

                const brightness = 0.04 + Math.random() * 0.08;
                colors[i * 3]     = brightness * 0.5;
                colors[i * 3 + 1] = brightness * 0.3;
                colors[i * 3 + 2] = brightness * 0.15;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.5, map: texture, vertexColors: true, transparent: true,
                opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 外晕粒子
        // ==========================================
        function createHaloParticles(texture) {
            const count = CONFIG.haloCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            haloData = {
                basePos: new Float32Array(count * 3),
                phases: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const r = CONFIG.nebulaRadius + Math.random() * 100;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.cos(phi);
                const z = r * Math.sin(phi) * Math.sin(theta);

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                haloData.basePos[i * 3]     = x;
                haloData.basePos[i * 3 + 1] = y;
                haloData.basePos[i * 3 + 2] = z;
                haloData.phases[i] = Math.random() * Math.PI * 2;

                const brightness = 0.06 + Math.random() * 0.1;
                const t = Math.random();
                if (t < 0.4) {
                    colors[i * 3] = brightness * 0.7;
                    colors[i * 3 + 1] = brightness * 0.3;
                    colors[i * 3 + 2] = brightness * 0.15;
                } else if (t < 0.7) {
                    colors[i * 3] = brightness * 0.2;
                    colors[i * 3 + 1] = brightness * 0.5;
                    colors[i * 3 + 2] = brightness * 0.7;
                } else {
                    colors[i * 3] = brightness * 0.2;
                    colors[i * 3 + 1] = brightness * 0.55;
                    colors[i * 3 + 2] = brightness * 0.35;
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 背景星空
        // ==========================================
        function createBgStarfield() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const count = CONFIG.bgStarCount;
            for (let i = 0; i < count; i++) {
                const r = 800 + Math.random() * 1500;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                const b = 0.4 + Math.random() * 0.5;
                const t = Math.random();
                if (t < 0.65) {
                    colors.push(b, b, b);
                } else if (t < 0.85) {
                    colors.push(b, b * 0.8, b * 0.5);
                } else {
                    colors.push(b * 0.6, b * 0.7, b);
                }
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 1.5, vertexColors: true, transparent: true,
                opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false
            }));
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.004;

            // 星团辉光脉动
            for (let i = 0; i < clusterGlows.length; i++) {
                const glow = clusterGlows[i];
                const phase = i * 0.3;
                const pulse = 1 + Math.sin(time * 2 + phase) * 0.06;
                glow.scale.set(pulse, pulse, pulse);
                if (i % 3 === 0) {
                    glow.material.opacity = 0.35 + Math.sin(time * 2.5 + phase) * 0.08;
                }
            }

            // Homunculus 缓慢旋转
            if (homunculusParticles1) homunculusParticles1.rotation.y += 0.0005;
            if (homunculusParticles2) homunculusParticles2.rotation.y += 0.0005;

            // 气体粒子漂移
            if (gasParticles && gasData) {
                const posAttr = gasParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = gasData.basePos.length / 3;
                for (let i = 0; i < n; i++) {
                    const baseX = gasData.basePos[i * 3];
                    const baseY = gasData.basePos[i * 3 + 1];
                    const baseZ = gasData.basePos[i * 3 + 2];
                    const phase = gasData.phases[i];
                    const speed = gasData.speeds[i];
                    arr[i * 3]     = baseX + Math.sin(time * speed + phase) * 2.5;
                    arr[i * 3 + 1] = baseY + Math.cos(time * speed * 0.7 + phase) * 2;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * speed * 0.5 + phase) * 2;
                }
                posAttr.needsUpdate = true;
            }

            // 尘埃云漂移
            if (dustParticles && dustData) {
                const posAttr = dustParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = dustData.basePos.length / 3;
                for (let i = 0; i < n; i++) {
                    const baseX = dustData.basePos[i * 3];
                    const baseY = dustData.basePos[i * 3 + 1];
                    const baseZ = dustData.basePos[i * 3 + 2];
                    const phase = dustData.phases[i];
                    arr[i * 3]     = baseX + Math.sin(time * 0.15 + phase) * 1.5;
                    arr[i * 3 + 1] = baseY + Math.cos(time * 0.12 + phase) * 1;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * 0.18 + phase) * 1.2;
                }
                posAttr.needsUpdate = true;
            }

            // 外晕漂移
            if (haloParticles && haloData) {
                const posAttr = haloParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = haloData.basePos.length / 3;
                for (let i = 0; i < n; i++) {
                    const baseX = haloData.basePos[i * 3];
                    const baseY = haloData.basePos[i * 3 + 1];
                    const baseZ = haloData.basePos[i * 3 + 2];
                    const phase = haloData.phases[i];
                    arr[i * 3]     = baseX + Math.sin(time * 0.08 + phase) * 2;
                    arr[i * 3 + 1] = baseY + Math.cos(time * 0.07 + phase) * 1.5;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * 0.09 + phase) * 2;
                }
                posAttr.needsUpdate = true;
            }

            // 星云组缓慢旋转
            if (nebulaGroup) {
                nebulaGroup.rotation.y += 0.0003;
            }

            if (bgStarfield) bgStarfield.rotation.y += 0.00005;

            controls.update();
            composer.render();
        }

        init();
        animate();
    </script>
</body>
</html>
