<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>螺旋星云 · Helix Nebula (NGC 7293)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: rgba(255,255,255,0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #aaccff;
            text-shadow: 0 0 18px rgba(80,140,220,1), 0 0 50px rgba(40,80,160,0.5), 0 2px 0 rgba(0,0,0,0.9);
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #88aadd;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(60,110,190,0.9);
        }

        .instruction {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(5,8,15,0.85);
            border: 1px solid rgba(80,140,220,0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid rgba(90,150,230,0.9);
            color: rgba(200,220,250,0.78);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(5,8,15,0.85);
            border: 1px solid rgba(80,140,220,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: rgba(190,210,240,0.72);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info b {
            color: #99bbff;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: rgba(100,160,230,0.9);
            font-size: 20px;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="loading">正在展开上帝之眼...</div>

    <div id="ui-layer">
        <h1>Helix Nebula</h1>
        <div class="subtitle">NGC 7293 · 螺旋星云 / 上帝之眼</div>
        <div class="instruction">
            🖱️ <b>拖拽</b>: 旋转视角<br>
            🔍 <b>滚轮</b>: 缩放距离
        </div>
        <div class="info">
            <b>类型</b>: 行星状星云 (PN)<br>
            <b>距离</b>: ~695 光年（宝瓶座）<br>
            <b>年龄</b>: ~10,600 年<br>
            <b>直径</b>: ~2.5 光年<br>
            <b>特征</b>: 垂死恒星 / 电离气体壳 / 彗状结 / 白矮星中心
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 配置
        // ==========================================
        const CONFIG = {
            // 中心白矮星
            dwarfRadius: 5,
            dwarfGlow1: 12,
            dwarfGlow2: 25,
            dwarfGlow3: 45,

            // 星云壳层半径
            shellInner: 60,      // 内壳层
            shellOuter: 110,     // 外壳层
            shellMain: 85,       // 主壳层（最密集）
            shellThickness: 30,  // 壳层厚度

            // 外晕
            haloInner: 120,
            haloOuter: 200,

            // 粒子数量
            gasParticleCount: 80000,    // 星云气体粒子
            knotCount: 300,             // 彗状结数量
            knotParticleCount: 80,      // 每个结的粒子数
            haloParticleCount: 15000,   // 外晕粒子
            bgStarCount: 5000,           // 背景星空

            // 星云倾斜
            tiltX: 0.25,
        };

        let scene, camera, renderer, composer, controls;
        let nebulaGroup;
        let centralDwarf, dwarfGlow1, dwarfGlow2, dwarfGlow3;
        let innerBubble, outerShell, haloSphere;
        let gasParticles, gasData = null;
        let knotParticles, knotData = null;
        let haloParticles, haloData = null;
        let bgStarfield;
        let bloomPass;
        let time = 0;

        const loadingEl = document.getElementById('loading');

        // ==========================================
        // 粒子纹理
        // ==========================================
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 初始化
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 50, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.6;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 50;
            controls.maxDistance = 1500;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.2;

            // 后期处理 — 强 Bloom（突出发光气体）
            const renderPass = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                2.0, 0.6, 0.0
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const tex = createParticleTexture();

            // 光源 — 中心白矮星辐射
            const dwarfLight = new THREE.PointLight(0xaaccff, 3.0, 500);
            scene.add(dwarfLight);
            const ambient = new THREE.AmbientLight(0x080815, 0.3);
            scene.add(ambient);

            // 星云组
            nebulaGroup = new THREE.Group();
            nebulaGroup.rotation.x = CONFIG.tiltX;
            scene.add(nebulaGroup);

            // === 中心白矮星 ===
            centralDwarf = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.dwarfRadius, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0xddeeff })
            );
            nebulaGroup.add(centralDwarf);

            // 白矮星多层辉光
            dwarfGlow1 = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.dwarfGlow1, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0xaaccff, transparent: true, opacity: 0.4,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(dwarfGlow1);

            dwarfGlow2 = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.dwarfGlow2, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0x88aaff, transparent: true, opacity: 0.15,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(dwarfGlow2);

            dwarfGlow3 = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.dwarfGlow3, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0x6688dd, transparent: true, opacity: 0.06,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(dwarfGlow3);

            // === 电离气泡层（大型透明球壳）===
            // 内层气泡 — 蓝绿色（OIII 发射）
            innerBubble = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.shellInner, 48, 48),
                new THREE.MeshBasicMaterial({
                    color: 0x44aacc, transparent: true, opacity: 0.04,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(innerBubble);

            // 外壳层 — 红橙色（H-alpha 发射）
            outerShell = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.shellOuter, 48, 48),
                new THREE.MeshBasicMaterial({
                    color: 0xff5533, transparent: true, opacity: 0.03,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(outerShell);

            // 外晕球
            haloSphere = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.haloOuter, 48, 48),
                new THREE.MeshBasicMaterial({
                    color: 0xaa3366, transparent: true, opacity: 0.015,
                    blending: THREE.AdditiveBlending, side: THREE.BackSide
                })
            );
            nebulaGroup.add(haloSphere);

            // === 星云气体粒子 ===
            gasParticles = createGasParticles(tex);
            nebulaGroup.add(gasParticles);

            // === 彗状结 ===
            knotParticles = createCometaryKnots(tex);
            nebulaGroup.add(knotParticles);

            // === 外晕粒子 ===
            haloParticles = createHaloParticles(tex);
            nebulaGroup.add(haloParticles);

            // === 背景星空 ===
            bgStarfield = createBgStarfield();
            scene.add(bgStarfield);

            renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
            window.addEventListener('resize', onResize);

            loadingEl.style.display = 'none';
        }

        // ==========================================
        // 星云气体粒子 — 在壳层中分布，按距离着色
        // ==========================================
        function createGasParticles(texture) {
            const count = CONFIG.gasParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            gasData = {
                baseR: new Float32Array(count),
                baseTheta: new Float32Array(count),
                basePhi: new Float32Array(count),
                phases: new Float32Array(count),
                speeds: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                // 在壳层中分布（高斯分布在主壳层附近）
                const rBase = CONFIG.shellMain;
                const rSpread = CONFIG.shellThickness;
                const r = rBase + (Math.random() - 0.5) * rSpread * 2 + (Math.random() - 0.5) * rSpread;

                // 球面分布（略偏向赤道面，形成环状）
                const theta = Math.random() * Math.PI * 2;
                // phi 偏向赤道（pi/2 附近），形成 donut 形状
                const phiCenter = Math.PI / 2;
                const phiSpread = 0.6;  // 控制环的厚度
                const phi = phiCenter + (Math.random() - 0.5) * phiSpread * Math.PI;

                positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi) * 0.6;  // 略扁平
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                gasData.baseR[i] = r;
                gasData.baseTheta[i] = theta;
                gasData.basePhi[i] = phi;
                gasData.phases[i] = Math.random() * Math.PI * 2;
                gasData.speeds[i] = 0.1 + Math.random() * 0.3;

                // 颜色：按距离着色
                // 内侧 = 蓝绿（OIII，[OIII] 5007Å）
                // 中部 = 青蓝过渡
                // 外侧 = 红/橙（H-alpha 6563Å）
                const distFactor = (r - CONFIG.shellInner) / (CONFIG.shellOuter - CONFIG.shellInner);
                const clampedT = Math.max(0, Math.min(1, distFactor));

                let r_col, g_col, b_col;
                if (clampedT < 0.3) {
                    // 蓝绿色 — OIII 发射
                    const t2 = clampedT / 0.3;
                    r_col = 0.3 + t2 * 0.2;
                    g_col = 0.8 + t2 * 0.1;
                    b_col = 0.9;
                } else if (clampedT < 0.6) {
                    // 青蓝过渡
                    const t2 = (clampedT - 0.3) / 0.3;
                    r_col = 0.5 + t2 * 0.3;
                    g_col = 0.7 - t2 * 0.2;
                    b_col = 0.9 - t2 * 0.2;
                } else {
                    // 红橙色 — H-alpha 发射
                    const t2 = (clampedT - 0.6) / 0.4;
                    r_col = 0.8 + t2 * 0.2;
                    g_col = 0.3 - t2 * 0.15;
                    b_col = 0.2 - t2 * 0.1;
                }

                // 少量随机变化
                const brightnessVar = 0.7 + Math.random() * 0.5;
                colors[i * 3]     = r_col * brightnessVar;
                colors[i * 3 + 1] = g_col * brightnessVar;
                colors[i * 3 + 2] = b_col * brightnessVar;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.5, map: texture, vertexColors: true, transparent: true,
                opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 彗状结 — 螺旋星云标志性特征
        // ==========================================
        function createCometaryKnots(texture) {
            const totalKnots = CONFIG.knotCount;
            const particlesPerKnot = CONFIG.knotParticleCount;
            const total = totalKnots * particlesPerKnot;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(total * 3);
            const colors = new Float32Array(total * 3);

            knotData = {
                knotPositions: [],
                knotRadii: new Float32Array(totalKnots),
                phases: new Float32Array(totalKnots),
            };

            for (let k = 0; k < totalKnots; k++) {
                // 结的位置：在主壳层上
                const r = CONFIG.shellMain + (Math.random() - 0.5) * CONFIG.shellThickness;
                const theta = Math.random() * Math.PI * 2;
                const phiCenter = Math.PI / 2;
                const phi = phiCenter + (Math.random() - 0.5) * 0.5 * Math.PI;

                const kx = r * Math.sin(phi) * Math.cos(theta);
                const ky = r * Math.cos(phi) * 0.6;
                const kz = r * Math.sin(phi) * Math.sin(theta);

                knotData.knotPositions.push({ x: kx, y: ky, z: kz });
                knotData.knotRadii[k] = r;
                knotData.phases[k] = Math.random() * Math.PI * 2;

                // 径向方向（向外）
                const dirX = kx / r;
                const dirY = ky / r;
                const dirZ = kz / r;

                // 距离因子（决定颜色）
                const distFactor = (r - CONFIG.shellInner) / (CONFIG.shellOuter - CONFIG.shellInner);
                const clampedT = Math.max(0, Math.min(1, distFactor));

                for (let p = 0; p < particlesPerKnot; p++) {
                    const idx = k * particlesPerKnot + p;

                    // 结的核心位置 + 尾巴（沿径向往外延伸）
                    const tailFactor = Math.random();
                    const tailLen = tailFactor * 15;

                    // 散布
                    const spread = 2 + tailFactor * 3;

                    positions[idx * 3]     = kx + dirX * tailLen + (Math.random() - 0.5) * spread;
                    positions[idx * 3 + 1] = ky + dirY * tailLen + (Math.random() - 0.5) * spread;
                    positions[idx * 3 + 2] = kz + dirZ * tailLen + (Math.random() - 0.5) * spread;

                    // 颜色：头部蓝白，尾部红
                    const headBright = 1 - tailFactor;
                    if (headBright > 0.6) {
                        // 头部 — 亮蓝白
                        colors[idx * 3]     = 0.6 + Math.random() * 0.3;
                        colors[idx * 3 + 1] = 0.7 + Math.random() * 0.3;
                        colors[idx * 3 + 2] = 0.9 + Math.random() * 0.1;
                    } else if (headBright > 0.3) {
                        // 中段 — 青绿
                        colors[idx * 3]     = 0.4 + Math.random() * 0.2;
                        colors[idx * 3 + 1] = 0.6 + Math.random() * 0.2;
                        colors[idx * 3 + 2] = 0.5 + Math.random() * 0.2;
                    } else {
                        // 尾部 — 红/橙
                        colors[idx * 3]     = 0.7 + Math.random() * 0.2;
                        colors[idx * 3 + 1] = 0.2 + Math.random() * 0.15;
                        colors[idx * 3 + 2] = 0.1 + Math.random() * 0.1;
                    }
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 外晕粒子
        // ==========================================
        function createHaloParticles(texture) {
            const count = CONFIG.haloParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            haloData = {
                baseR: new Float32Array(count),
                baseTheta: new Float32Array(count),
                basePhi: new Float32Array(count),
                phases: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const r = CONFIG.haloInner + Math.random() * (CONFIG.haloOuter - CONFIG.haloInner);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi) * 0.8;
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                haloData.baseR[i] = r;
                haloData.baseTheta[i] = theta;
                haloData.basePhi[i] = phi;
                haloData.phases[i] = Math.random() * Math.PI * 2;

                // 暗红紫色
                const brightness = 0.15 + Math.random() * 0.25;
                const distFactor = (r - CONFIG.haloInner) / (CONFIG.haloOuter - CONFIG.haloInner);
                colors[i * 3]     = brightness * (0.8 + distFactor * 0.2);
                colors[i * 3 + 1] = brightness * (0.2 + distFactor * 0.15);
                colors[i * 3 + 2] = brightness * (0.3 + distFactor * 0.2);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 背景星空
        // ==========================================
        function createBgStarfield() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const count = CONFIG.bgStarCount;
            for (let i = 0; i < count; i++) {
                const r = 800 + Math.random() * 1500;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                const b = 0.4 + Math.random() * 0.5;
                const t = Math.random();
                if (t < 0.7) {
                    colors.push(b, b, b);
                } else if (t < 0.85) {
                    colors.push(b, b * 0.8, b * 0.5);
                } else {
                    colors.push(b * 0.6, b * 0.7, b);
                }
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 1.5, vertexColors: true, transparent: true,
                opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false
            }));
        }

        // ==========================================
        // 窗口适配
        // ==========================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 动画循环
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.004;

            // 中心白矮星脉动
            if (dwarfGlow1) {
                const p = 1 + Math.sin(time * 3) * 0.08;
                dwarfGlow1.scale.set(p, p, p);
                dwarfGlow1.material.opacity = 0.35 + Math.sin(time * 2.5) * 0.08;
            }
            if (dwarfGlow2) {
                const p = 1 + Math.sin(time * 2 + 0.5) * 0.06;
                dwarfGlow2.scale.set(p, p, p);
            }
            if (dwarfGlow3) {
                const p = 1 + Math.sin(time * 1.5 + 1) * 0.05;
                dwarfGlow3.scale.set(p, p, p);
            }

            // 气泡层脉动
            if (innerBubble) {
                const p = 1 + Math.sin(time * 0.8) * 0.02;
                innerBubble.scale.set(p, p, p);
                innerBubble.material.opacity = 0.035 + Math.sin(time * 1.0) * 0.01;
            }
            if (outerShell) {
                const p = 1 + Math.sin(time * 0.6) * 0.025;
                outerShell.scale.set(p, p, p);
            }
            if (haloSphere) {
                const p = 1 + Math.sin(time * 0.4) * 0.03;
                haloSphere.scale.set(p, p, p);
            }

            // 气体粒子缓慢膨胀（模拟星云缓慢扩张）
            if (gasParticles && gasData) {
                const posAttr = gasParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = gasData.baseR.length;
                const expansionRate = 0.02;

                for (let i = 0; i < n; i++) {
                    const r = gasData.baseR[i] + Math.sin(time * gasData.speeds[i] + gasData.phases[i]) * 1.5 + time * expansionRate;
                    const theta = gasData.baseTheta[i] + time * 0.005;
                    const phi = gasData.basePhi[i];

                    arr[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                    arr[i * 3 + 1] = r * Math.cos(phi) * 0.6;
                    arr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                }
                posAttr.needsUpdate = true;
            }

            // 彗状结缓慢旋转
            if (knotParticles) {
                knotParticles.rotation.y += 0.0003;
            }

            // 外晕粒子缓慢漂移
            if (haloParticles && haloData) {
                const posAttr = haloParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = haloData.baseR.length;

                for (let i = 0; i < n; i++) {
                    const r = haloData.baseR[i] + Math.sin(time * 0.3 + haloData.phases[i]) * 2;
                    const theta = haloData.baseTheta[i] + time * 0.003;
                    const phi = haloData.basePhi[i];

                    arr[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                    arr[i * 3 + 1] = r * Math.cos(phi) * 0.8;
                    arr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                }
                posAttr.needsUpdate = true;
            }

            // 星云组缓慢旋转
            if (nebulaGroup) {
                nebulaGroup.rotation.y += 0.0005;
            }

            // 背景星空
            if (bgStarfield) bgStarfield.rotation.y += 0.00005;

            controls.update();
            composer.render();
        }

        init();
        animate();
    </script>
</body>
</html>
