<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猎户星云 · Orion Nebula (M42)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: rgba(255,255,255,0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffaa66;
            text-shadow: 0 0 18px rgba(200,120,50,1), 0 0 50px rgba(150,70,20,0.5), 0 2px 0 rgba(0,0,0,0.9);
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #cc8844;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(160,90,30,0.9);
        }

        .instruction {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(12,8,4,0.85);
            border: 1px solid rgba(200,140,60,0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid rgba(210,150,70,0.9);
            color: rgba(230,210,180,0.78);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(12,8,4,0.85);
            border: 1px solid rgba(200,140,60,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: rgba(220,200,170,0.72);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info b {
            color: #eebb66;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: rgba(220,150,60,0.9);
            font-size: 20px;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="loading">正在点亮恒星摇篮...</div>

    <div id="ui-layer">
        <h1>Orion Nebula</h1>
        <div class="subtitle">M42 / NGC 1976 · 猎户星云</div>
        <div class="instruction">
            🖱️ <b>拖拽</b>: 旋转视角<br>
            🔍 <b>滚轮</b>: 缩放距离
        </div>
        <div class="info">
            <b>类型</b>: 发射星云 / 恒星形成区 (HII)<br>
            <b>距离</b>: ~1,344 光年（猎户座）<br>
            <b>直径</b>: ~24 光年<br>
            <b>年龄</b>: ~300 万年<br>
            <b>特征</b>: 猎户四边形星团 / OIII+Hα发射 / 暗尘埃带 / 原行星盘
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const CONFIG = {
            // 四边形星团（4颗主要恒星）
            trapeziumStars: [
                { pos: [0, 0, 0],       radius: 4, color: 0xaaccff, glowColor: 0x88aaff, name: 'θ¹ Ori A' },
                { pos: [12, 3, -5],     radius: 5, color: 0xddeeff, glowColor: 0xaaccff, name: 'θ¹ Ori B' },
                { pos: [-8, -4, 6],     radius: 4.5, color: 0xaaccff, glowColor: 0x88aaff, name: 'θ¹ Ori C' },
                { pos: [5, -6, -8],     radius: 3.5, color: 0xffeecc, glowColor: 0xffcc88, name: 'θ¹ Ori D' },
            ],
            // 星云气体参数
            gasParticleCount: 100000,
            dustParticleCount: 30000,
            proplydCount: 40,
            haloParticleCount: 12000,
            bgStarCount: 6000,
            // 星云核心半径
            coreRadius: 120,
            // 倾斜
            tiltX: 0.2,
            tiltZ: 0.1,
        };

        let scene, camera, renderer, composer, controls;
        let nebulaGroup;
        let trapeziumMeshes = [];
        let trapeziumGlows = [];
        let gasParticles, gasData = null;
        let dustParticles, dustData = null;
        let proplydGroup;
        let haloParticles, haloData = null;
        let bgStarfield;
        let bloomPass;
        let time = 0;

        const loadingEl = document.getElementById('loading');

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 伪噪声函数（生成有机不规则形状）
        // ==========================================
        function noise3D(x, y, z) {
            return Math.sin(x * 0.03) * Math.cos(y * 0.04) * Math.sin(z * 0.035)
                 + Math.sin(x * 0.08 + 1) * Math.cos(y * 0.07 + 2) * Math.sin(z * 0.06 + 3) * 0.5
                 + Math.sin(x * 0.15 + 4) * Math.cos(y * 0.13 + 5) * Math.sin(z * 0.11 + 6) * 0.25;
        }

        // ==========================================
        // 初始化
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.00018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 60, 350);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.6;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 50;
            controls.maxDistance = 1500;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;

            const renderPass = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                2.2, 0.6, 0.0
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const tex = createParticleTexture();

            // 中心光源（四边形星团照亮星云）
            const coreLight = new THREE.PointLight(0xffeecc, 3.5, 500);
            scene.add(coreLight);
            const ambient = new THREE.AmbientLight(0x0a0815, 0.3);
            scene.add(ambient);

            // 星云组
            nebulaGroup = new THREE.Group();
            nebulaGroup.rotation.x = CONFIG.tiltX;
            nebulaGroup.rotation.z = CONFIG.tiltZ;
            scene.add(nebulaGroup);

            // === 猎户四边形星团 ===
            for (const starDef of CONFIG.trapeziumStars) {
                const star = new THREE.Mesh(
                    new THREE.SphereGeometry(starDef.radius, 24, 24),
                    new THREE.MeshBasicMaterial({ color: starDef.color })
                );
                star.position.set(starDef.pos[0], starDef.pos[1], starDef.pos[2]);
                nebulaGroup.add(star);
                trapeziumMeshes.push(star);

                // 多层辉光
                const glow1 = new THREE.Mesh(
                    new THREE.SphereGeometry(starDef.radius * 2.5, 24, 24),
                    new THREE.MeshBasicMaterial({
                        color: starDef.glowColor, transparent: true, opacity: 0.35,
                        blending: THREE.AdditiveBlending, side: THREE.BackSide
                    })
                );
                glow1.position.copy(star.position);
                nebulaGroup.add(glow1);
                trapeziumGlows.push(glow1);

                const glow2 = new THREE.Mesh(
                    new THREE.SphereGeometry(starDef.radius * 5, 24, 24),
                    new THREE.MeshBasicMaterial({
                        color: starDef.glowColor, transparent: true, opacity: 0.12,
                        blending: THREE.AdditiveBlending, side: THREE.BackSide
                    })
                );
                glow2.position.copy(star.position);
                nebulaGroup.add(glow2);
                trapeziumGlows.push(glow2);

                const glow3 = new THREE.Mesh(
                    new THREE.SphereGeometry(starDef.radius * 10, 24, 24),
                    new THREE.MeshBasicMaterial({
                        color: starDef.glowColor, transparent: true, opacity: 0.04,
                        blending: THREE.AdditiveBlending, side: THREE.BackSide
                    })
                );
                glow3.position.copy(star.position);
                nebulaGroup.add(glow3);
                trapeziumGlows.push(glow3);
            }

            // === 星云气体粒子 ===
            gasParticles = createGasParticles(tex);
            nebulaGroup.add(gasParticles);

            // === 暗尘埃粒子 ===
            dustParticles = createDustParticles(tex);
            nebulaGroup.add(dustParticles);

            // === 原行星盘 (Proplyds) ===
            proplydGroup = createProplyds(tex);
            nebulaGroup.add(proplydGroup);

            // === 外晕 ===
            haloParticles = createHaloParticles(tex);
            nebulaGroup.add(haloParticles);

            // === 背景星空 ===
            bgStarfield = createBgStarfield();
            scene.add(bgStarfield);

            renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
            window.addEventListener('resize', onResize);

            loadingEl.style.display = 'none';
        }

        // ==========================================
        // 星云气体粒子 — 不规则有机形状 + 多色发射
        // ==========================================
        function createGasParticles(texture) {
            const count = CONFIG.gasParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            gasData = {
                basePos: new Float32Array(count * 3),
                velocities: new Float32Array(count * 3),
                phases: new Float32Array(count),
                speeds: new Float32Array(count),
                types: new Float32Array(count),  // 0=Hα红, 1=OIII绿, 2=反射蓝
            };

            for (let i = 0; i < count; i++) {
                // 在不规则形状中分布
                let x, y, z, density;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * CONFIG.coreRadius * 2;
                    y = (Math.random() - 0.5) * CONFIG.coreRadius * 1.5;
                    z = (Math.random() - 0.5) * CONFIG.coreRadius * 2;
                    density = noise3D(x, y, z);
                    attempts++;
                } while (density < -0.1 && attempts < 5);

                // 距中心因子
                const dist = Math.sqrt(x*x + y*y + z*z);
                const distFactor = dist / CONFIG.coreRadius;

                // 越远越稀疏
                if (distFactor > 1.0 && Math.random() > (1.0 / distFactor) * 0.3) {
                    i--;
                    continue;
                }

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                gasData.basePos[i * 3]     = x;
                gasData.basePos[i * 3 + 1] = y;
                gasData.basePos[i * 3 + 2] = z;
                gasData.phases[i] = Math.random() * Math.PI * 2;
                gasData.speeds[i] = 0.1 + Math.random() * 0.3;

                // 颜色：根据噪声值和距离分配发射类型
                const noiseVal = noise3D(x * 1.5, y * 1.5, z * 1.5);
                let r, g, b;

                if (noiseVal > 0.3) {
                    // H-alpha 红粉色（电离氢区）
                    gasData.types[i] = 0;
                    r = 0.9 + Math.random() * 0.1;
                    g = 0.15 + Math.random() * 0.15;
                    b = 0.2 + Math.random() * 0.15;
                } else if (noiseVal > -0.1) {
                    // OIII 绿色（双电离氧）
                    gasData.types[i] = 1;
                    r = 0.2 + Math.random() * 0.15;
                    g = 0.7 + Math.random() * 0.2;
                    b = 0.4 + Math.random() * 0.15;
                } else {
                    // 反射星云蓝色
                    gasData.types[i] = 2;
                    r = 0.2 + Math.random() * 0.1;
                    g = 0.35 + Math.random() * 0.15;
                    b = 0.7 + Math.random() * 0.2;
                }

                // 中心更亮
                const brightness = (1.0 - distFactor * 0.6) * (0.5 + Math.random() * 0.6);
                colors[i * 3]     = r * brightness;
                colors[i * 3 + 1] = g * brightness;
                colors[i * 3 + 2] = b * brightness;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 3.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 暗尘埃粒子 — 吸收光的尘埃带
        // ==========================================
        function createDustParticles(texture) {
            const count = CONFIG.dustParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            dustData = {
                basePos: new Float32Array(count * 3),
                phases: new Float32Array(count),
            };

            // "鱼嘴"暗尘埃带 — 偏向星云一侧的带状结构
            for (let i = 0; i < count; i++) {
                // 分布在一条偏斜的带上
                const bandY = -20 + (Math.random() - 0.5) * 25;
                const bandX = (Math.random() - 0.5) * CONFIG.coreRadius * 1.5;
                const bandZ = (Math.random() - 0.5) * CONFIG.coreRadius * 1.2;

                // 加噪声让形状不规则
                const n = noise3D(bandX * 2, bandY * 2, bandZ * 2) * 20;
                const x = bandX + n * 0.5;
                const y = bandY + n * 0.3;
                const z = bandZ + n * 0.5;

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                dustData.basePos[i * 3]     = x;
                dustData.basePos[i * 3 + 1] = y;
                dustData.basePos[i * 3 + 2] = z;
                dustData.phases[i] = Math.random() * Math.PI * 2;

                // 暗褐色尘埃
                const brightness = 0.05 + Math.random() * 0.1;
                colors[i * 3]     = brightness * 0.5;
                colors[i * 3 + 1] = brightness * 0.35;
                colors[i * 3 + 2] = brightness * 0.2;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.5, map: texture, vertexColors: true, transparent: true,
                opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 原行星盘 (Proplyds) — 年轻恒星周围的尘埃盘
        // ==========================================
        function createProplyds(texture) {
            const group = new THREE.Group();
            const count = CONFIG.proplydCount;

            for (let i = 0; i < count; i++) {
                // 在星云中随机位置
                let x, y, z, density;
                do {
                    x = (Math.random() - 0.5) * CONFIG.coreRadius * 1.5;
                    y = (Math.random() - 0.5) * CONFIG.coreRadius;
                    z = (Math.random() - 0.5) * CONFIG.coreRadius * 1.5;
                    density = noise3D(x, y, z);
                } while (density < 0);

                // 中心小恒星
                const starSize = 0.8 + Math.random() * 0.6;
                const star = new THREE.Mesh(
                    new THREE.SphereGeometry(starSize, 12, 12),
                    new THREE.MeshBasicMaterial({ color: 0xffeebb })
                );
                star.position.set(x, y, z);
                group.add(star);

                // 辉光
                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(starSize * 3, 12, 12),
                    new THREE.MeshBasicMaterial({
                        color: 0xffddaa, transparent: true, opacity: 0.2,
                        blending: THREE.AdditiveBlending, side: THREE.BackSide
                    })
                );
                glow.position.copy(star.position);
                group.add(glow);

                // 尘埃盘粒子（小型）
                const diskCount = 60;
                const diskGeo = new THREE.BufferGeometry();
                const diskPos = new Float32Array(diskCount * 3);
                const diskCol = new Float32Array(diskCount * 3);
                const diskTilt = Math.random() * Math.PI;
                const diskTilt2 = Math.random() * Math.PI;

                for (let p = 0; p < diskCount; p++) {
                    const r = starSize * 1.5 + Math.random() * starSize * 4;
                    const a = Math.random() * Math.PI * 2;
                    let dx = r * Math.cos(a);
                    let dy = 0;
                    let dz = r * Math.sin(a) * 0.3;  // 扁盘

                    // 倾斜
                    const cosT = Math.cos(diskTilt);
                    const sinT = Math.sin(diskTilt);
                    const ny = dy * cosT - dz * sinT;
                    const nz = dy * sinT + dz * cosT;
                    dy = ny; dz = nz;

                    const cosT2 = Math.cos(diskTilt2);
                    const sinT2 = Math.sin(diskTilt2);
                    const nx = dx * cosT2 - dz * sinT2;
                    const nz2 = dx * sinT2 + dz * cosT2;
                    dx = nx; dz = nz2;

                    diskPos[p * 3]     = x + dx;
                    diskPos[p * 3 + 1] = y + dy;
                    diskPos[p * 3 + 2] = z + dz;

                    const b = 0.15 + Math.random() * 0.15;
                    diskCol[p * 3]     = b * 0.6;
                    diskCol[p * 3 + 1] = b * 0.5;
                    diskCol[p * 3 + 2] = b * 0.3;
                }

                diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
                diskGeo.setAttribute('color', new THREE.BufferAttribute(diskCol, 3));

                const disk = new THREE.Points(diskGeo, new THREE.PointsMaterial({
                    size: 1.0, map: texture, vertexColors: true, transparent: true,
                    opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
                    sizeAttenuation: true
                }));
                group.add(disk);
            }

            return group;
        }

        // ==========================================
        // 外晕粒子
        // ==========================================
        function createHaloParticles(texture) {
            const count = CONFIG.haloParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            haloData = {
                basePos: new Float32Array(count * 3),
                phases: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const r = CONFIG.coreRadius + Math.random() * 150;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.cos(phi) * 0.7;
                const z = r * Math.sin(phi) * Math.sin(theta);

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                haloData.basePos[i * 3]     = x;
                haloData.basePos[i * 3 + 1] = y;
                haloData.basePos[i * 3 + 2] = z;
                haloData.phases[i] = Math.random() * Math.PI * 2;

                // 暗红橙色
                const brightness = 0.1 + Math.random() * 0.15;
                colors[i * 3]     = brightness * 0.8;
                colors[i * 3 + 1] = brightness * 0.4;
                colors[i * 3 + 2] = brightness * 0.25;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 2.0, map: texture, vertexColors: true, transparent: true,
                opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 背景星空
        // ==========================================
        function createBgStarfield() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const count = CONFIG.bgStarCount;
            for (let i = 0; i < count; i++) {
                const r = 800 + Math.random() * 1500;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                const b = 0.4 + Math.random() * 0.5;
                const t = Math.random();
                if (t < 0.6) {
                    colors.push(b, b, b);
                } else if (t < 0.8) {
                    colors.push(b, b * 0.8, b * 0.5);
                } else {
                    colors.push(b * 0.6, b * 0.7, b);
                }
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 1.5, vertexColors: true, transparent: true,
                opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false
            }));
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            // 四边形星团辉光脉动
            for (let i = 0; i < trapeziumGlows.length; i++) {
                const glow = trapeziumGlows[i];
                const phase = i * 0.5;
                const pulse = 1 + Math.sin(time * 2 + phase) * 0.06;
                glow.scale.set(pulse, pulse, pulse);
                if (i % 3 === 0) {
                    glow.material.opacity = 0.3 + Math.sin(time * 2.5 + phase) * 0.08;
                }
            }

            // 气体粒子缓慢漂移
            if (gasParticles && gasData) {
                const posAttr = gasParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = gasData.basePos.length / 3;

                for (let i = 0; i < n; i++) {
                    const baseX = gasData.basePos[i * 3];
                    const baseY = gasData.basePos[i * 3 + 1];
                    const baseZ = gasData.basePos[i * 3 + 2];
                    const phase = gasData.phases[i];
                    const speed = gasData.speeds[i];

                    const drift = Math.sin(time * speed + phase) * 3;
                    const drift2 = Math.cos(time * speed * 0.7 + phase) * 2;

                    arr[i * 3]     = baseX + drift;
                    arr[i * 3 + 1] = baseY + drift2;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * speed * 0.5 + phase) * 2.5;
                }
                posAttr.needsUpdate = true;
            }

            // 尘埃粒子漂移
            if (dustParticles && dustData) {
                const posAttr = dustParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = dustData.basePos.length / 3;

                for (let i = 0; i < n; i++) {
                    const baseX = dustData.basePos[i * 3];
                    const baseY = dustData.basePos[i * 3 + 1];
                    const baseZ = dustData.basePos[i * 3 + 2];
                    const phase = dustData.phases[i];

                    arr[i * 3]     = baseX + Math.sin(time * 0.2 + phase) * 1.5;
                    arr[i * 3 + 1] = baseY + Math.cos(time * 0.15 + phase) * 1;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * 0.18 + phase) * 1.2;
                }
                posAttr.needsUpdate = true;
            }

            // 外晕粒子漂移
            if (haloParticles && haloData) {
                const posAttr = haloParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = haloData.basePos.length / 3;

                for (let i = 0; i < n; i++) {
                    const baseX = haloData.basePos[i * 3];
                    const baseY = haloData.basePos[i * 3 + 1];
                    const baseZ = haloData.basePos[i * 3 + 2];
                    const phase = haloData.phases[i];

                    arr[i * 3]     = baseX + Math.sin(time * 0.1 + phase) * 2;
                    arr[i * 3 + 1] = baseY + Math.cos(time * 0.08 + phase) * 1.5;
                    arr[i * 3 + 2] = baseZ + Math.sin(time * 0.12 + phase) * 2;
                }
                posAttr.needsUpdate = true;
            }

            // 星云组缓慢旋转
            if (nebulaGroup) {
                nebulaGroup.rotation.y += 0.0004;
            }

            // 背景星空
            if (bgStarfield) bgStarfield.rotation.y += 0.00005;

            controls.update();
            composer.render();
        }

        init();
        animate();
    </script>
</body>
</html>
