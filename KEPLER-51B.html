<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler-51b · 超蓬松行星</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: grab;
        }
        body:active { cursor: grabbing; }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: rgba(255,255,255,0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #aa99dd;
            text-shadow: 0 0 18px rgba(140,110,200,1), 0 0 50px rgba(100,70,160,0.5), 0 2px 0 rgba(0,0,0,0.9);
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #9988cc;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(120,90,170,0.9);
        }

        .instruction {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(10,8,15,0.85);
            border: 1px solid rgba(140,110,190,0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid rgba(150,120,200,0.9);
            color: rgba(210,200,230,0.78);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(10,8,15,0.85);
            border: 1px solid rgba(140,110,190,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: rgba(200,190,220,0.72);
            line-height: 1.8;
            backdrop-filter: blur(4px);
        }

        .info b {
            color: #bb99ee;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: rgba(150,120,200,0.9);
            font-size: 20px;
            z-index: 20;
            text-align: center;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="loading">正在膨胀大气层...</div>

    <div id="ui-layer">
        <h1>Kepler-51 b</h1>
        <div class="subtitle">SUPER-PUFF · 超蓬松行星</div>
        <div class="instruction">
            🖱️ <b>拖拽</b>: 旋转视角<br>
            🔍 <b>滚轮</b>: 缩放距离
        </div>
        <div class="info">
            <b>类型</b>: 超蓬松行星（极低密度）<br>
            <b>距离</b>: 约 2,615 光年<br>
            <b>半径</b>: ~7 倍地球半径<br>
            <b>密度</b>: ~0.05 g/cm³（棉花糖级）<br>
            <b>特征</b>: 极厚氢氦大气 / 雾霾层 / 年轻
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 配置
        // ==========================================
        const CONFIG = {
            planetRadius: 40,
            // 超蓬松行星特征：异常延伸的大气层
            atmosphereInner: 48,
            atmosphereMid: 56,
            atmosphereOuter: 68,
            hazeRadius: 85,        // 极远的弥散雾霭
            outermostHaze: 110,    // 最外层稀薄大气
            hazeParticleCount: 25000,  // 大气雾霾粒子
            orbitParticleCount: 18000,
            starCount: 4000,
        };

        let scene, camera, renderer, composer, controls;
        let planet, atmoInner, atmoMid, atmoOuter, haze, outermostHaze;
        let hazeParticles, hazeData = null;
        let orbitParticles, orbitData = null;
        let starfield;
        let bloomPass;
        let time = 0;

        const loadingEl = document.getElementById('loading');

        // ==========================================
        // 粒子纹理
        // ==========================================
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0,   'rgba(255,255,255,1)');
            g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            g.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // Kepler-51b 表面纹理 — 淡紫色蓬松气态行星
        // ==========================================
        function createPlanetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 基底：淡紫蓝渐变（极厚氢氦大气，有雾霾散射）
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0,    '#665588');  // 极区暗紫
            grad.addColorStop(0.1,  '#776699');
            grad.addColorStop(0.25, '#9988bb');
            grad.addColorStop(0.4,  '#aa99cc');  // 中纬度
            grad.addColorStop(0.5,  '#bbaadd');  // 赤道最亮
            grad.addColorStop(0.6,  '#aa99cc');
            grad.addColorStop(0.75, '#9988bb');
            grad.addColorStop(0.9,  '#776699');
            grad.addColorStop(1,    '#665588');  // 极区暗紫
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            // 极淡的云带条纹（蓬松大气特征——条纹非常柔和模糊）
            for (let band = 0; band < 14; band++) {
                const y = (band / 14) * 512;
                const h = 512 / 14;
                const isLight = band % 2 === 0;
                const alpha = 0.04 + Math.random() * 0.06;

                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x <= 1024; x += 10) {
                    const wobble = Math.sin(x * 0.018 + band * 1.3) * 3;
                    ctx.lineTo(x, y + wobble);
                }
                ctx.lineTo(1024, y + h);
                for (let x = 1024; x >= 0; x -= 10) {
                    const wobble = Math.sin(x * 0.018 + band * 1.3 + 0.6) * 3;
                    ctx.lineTo(x, y + h + wobble);
                }
                ctx.closePath();

                if (isLight) {
                    ctx.fillStyle = `rgba(210,200,235,${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(80,60,110,${alpha})`;
                }
                ctx.fill();
            }

            // 极柔和的大尺度涡旋（蓬松大气中的大型气流结构）
            for (let i = 0; i < 25; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const rx = Math.random() * 40 + 15;
                const ry = rx * (0.5 + Math.random() * 0.3);
                const alpha = Math.random() * 0.12 + 0.03;
                const bright = Math.random() > 0.5;
                const vGrad = ctx.createRadialGradient(x, y, 0, x, y, rx);
                if (bright) {
                    vGrad.addColorStop(0, `rgba(220,210,245,${alpha})`);
                    vGrad.addColorStop(1, 'rgba(180,170,210,0)');
                } else {
                    vGrad.addColorStop(0, `rgba(60,45,80,${alpha})`);
                    vGrad.addColorStop(1, 'rgba(90,70,110,0)');
                }
                ctx.fillStyle = vGrad;
                ctx.beginPath();
                ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            // 雾霾散射亮区（大气中悬浮粒子散射光的效果）
            for (let i = 0; i < 80; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const rx = Math.random() * 18 + 5;
                const alpha = Math.random() * 0.08 + 0.02;
                const vGrad = ctx.createRadialGradient(x, y, 0, x, y, rx);
                vGrad.addColorStop(0, `rgba(200,190,230,${alpha})`);
                vGrad.addColorStop(0.5, `rgba(170,160,200,${alpha * 0.5})`);
                vGrad.addColorStop(1, 'rgba(140,130,170,0)');
                ctx.fillStyle = vGrad;
                ctx.beginPath();
                ctx.arc(x, y, rx, 0, Math.PI * 2);
                ctx.fill();
            }

            // 细微颗粒
            for (let i = 0; i < 9000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const size = Math.random() * 1.3 + 0.3;
                const brightness = Math.random() * 0.13 + 0.03;
                const hue = 250 + Math.random() * 30;  // 紫蓝调
                const sat = 15 + Math.random() * 25;
                const light = 45 + Math.random() * 35;
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 初始化
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 20, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 鼠标控制
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.6;
            controls.zoomSpeed = 1.2;
            controls.minDistance = 80;
            controls.maxDistance = 1200;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;

            // 后期处理 — Bloom（中等强度突出蓬松感）
            const renderPass = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.6, 0.7, 0.0
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            const tex = createParticleTexture();

            // 光源
            const sunLight = new THREE.DirectionalLight(0xfff0ff, 1.0);
            sunLight.position.set(300, 80, 200);
            scene.add(sunLight);
            const ambient = new THREE.AmbientLight(0x221128, 0.5);
            scene.add(ambient);

            // --- 行星表面 ---
            const planetTex = createPlanetTexture();
            planet = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.planetRadius, 96, 96),
                new THREE.MeshBasicMaterial({
                    map: planetTex,
                    color: 0xffffff
                })
            );
            scene.add(planet);

            // --- 五层蓬松大气辉光（超蓬松行星的核心特征） ---

            // 第一层：紧贴表面
            atmoInner = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.atmosphereInner, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0x9988cc, transparent: true, opacity: 0.15,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending
                })
            );
            scene.add(atmoInner);

            // 第二层：中层大气
            atmoMid = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.atmosphereMid, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0x8877bb, transparent: true, opacity: 0.1,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending
                })
            );
            scene.add(atmoMid);

            // 第三层：外层大气
            atmoOuter = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.atmosphereOuter, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0x7766aa, transparent: true, opacity: 0.06,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending
                })
            );
            scene.add(atmoOuter);

            // 第四层：弥散雾霭
            haze = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.hazeRadius, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0x886699, transparent: true, opacity: 0.03,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending
                })
            );
            scene.add(haze);

            // 第五层：最外层稀薄大气（超蓬松特征——大气延伸极远）
            outermostHaze = new THREE.Mesh(
                new THREE.SphereGeometry(CONFIG.outermostHaze, 64, 64),
                new THREE.MeshBasicMaterial({
                    color: 0x776688, transparent: true, opacity: 0.015,
                    side: THREE.BackSide, blending: THREE.AdditiveBlending
                })
            );
            scene.add(outermostHaze);

            // --- 大气雾霾粒子 ---
            hazeParticles = createHazeParticles(tex);
            scene.add(hazeParticles);

            // --- 轨道粒子 ---
            orbitParticles = createOrbitParticles(tex);
            scene.add(orbitParticles);

            // --- 星空背景 ---
            starfield = createStarfield();
            scene.add(starfield);

            // 用户交互时暂停自动旋转
            renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });

            window.addEventListener('resize', onResize);

            loadingEl.style.display = 'none';
        }

        // ==========================================
        // 大气雾霾粒子 — 蓬松大气中的悬浮粒子
        // ==========================================
        function createHazeParticles(texture) {
            const count = CONFIG.hazeParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            hazeData = {
                baseAngles: new Float32Array(count),
                latAngles: new Float32Array(count),
                radii: new Float32Array(count),
                driftSpeeds: new Float32Array(count),
                phases: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const lat = (Math.random() - 0.5) * Math.PI;
                // 粒子从行星表面到最外层大气分布（越远越稀疏）
                const t = Math.pow(Math.random(), 0.5);  // 偏向内侧
                const r = CONFIG.planetRadius + 2 + t * (CONFIG.outermostHaze - CONFIG.planetRadius - 5);

                positions[i * 3]     = r * Math.cos(lat) * Math.cos(angle);
                positions[i * 3 + 1] = r * Math.sin(lat);
                positions[i * 3 + 2] = r * Math.cos(lat) * Math.sin(angle);

                hazeData.baseAngles[i] = angle;
                hazeData.latAngles[i] = lat;
                hazeData.radii[i] = r;
                hazeData.driftSpeeds[i] = 0.1 + Math.random() * 0.4;
                hazeData.phases[i] = Math.random() * Math.PI * 2;

                // 颜色：淡紫白色，越远越暗
                const distFactor = 1 - (r - CONFIG.planetRadius) / (CONFIG.outermostHaze - CONFIG.planetRadius);
                const brightness = 0.3 + distFactor * 0.5;
                const hueVar = Math.random() * 0.15;
                colors[i * 3]     = (0.7 + hueVar) * brightness;
                colors[i * 3 + 1] = (0.65 + hueVar) * brightness;
                colors[i * 3 + 2] = (0.85 + hueVar) * brightness;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 1.5, map: texture, vertexColors: true, transparent: true,
                opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 轨道粒子
        // ==========================================
        function createOrbitParticles(texture) {
            const count = CONFIG.orbitParticleCount;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            orbitData = {
                semiMajors: new Float32Array(count),
                semiMinors: new Float32Array(count),
                inclinations: new Float32Array(count),
                longitudes: new Float32Array(count),
                baseAngles: new Float32Array(count),
                speeds: new Float32Array(count),
            };

            for (let i = 0; i < count; i++) {
                const a = 150 + Math.random() * 220;
                const ecc = 0.05 + Math.random() * 0.25;
                const b = a * (1 - ecc);
                const inc = (Math.random() - 0.5) * 0.4;
                const lon = Math.random() * Math.PI * 2;
                const angle = Math.random() * Math.PI * 2;

                orbitData.semiMajors[i] = a;
                orbitData.semiMinors[i] = b;
                orbitData.inclinations[i] = inc;
                orbitData.longitudes[i] = lon;
                orbitData.baseAngles[i] = angle;
                orbitData.speeds[i] = 0.06 * Math.sqrt(150 / a) * 0.25;

                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                let x = a * cosA;
                let z = b * sinA;
                let y = 0;
                const cosI = Math.cos(inc);
                const sinI = Math.sin(inc);
                const ny = y * cosI - z * sinI;
                const nz = y * sinI + z * cosI;
                y = ny; z = nz;
                const cosL = Math.cos(lon);
                const sinL = Math.sin(lon);
                const nx = x * cosL - z * sinL;
                const nz2 = x * sinL + z * cosL;
                x = nx; z = nz2;

                positions[i * 3]     = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                const t = Math.random();
                colors[i * 3]     = 0.5 + t * 0.2;
                colors[i * 3 + 1] = 0.45 + t * 0.2;
                colors[i * 3 + 2] = 0.65 + t * 0.2;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geo, new THREE.PointsMaterial({
                size: 1.5, map: texture, vertexColors: true, transparent: true,
                opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false,
                sizeAttenuation: true
            }));
        }

        // ==========================================
        // 星空背景
        // ==========================================
        function createStarfield() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const count = CONFIG.starCount;
            for (let i = 0; i < count; i++) {
                const r = 800 + Math.random() * 1500;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xffffff, size: 1.5, transparent: true,
                opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false
            }));
        }

        // ==========================================
        // 窗口适配
        // ==========================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 动画循环
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.006;

            // 行星缓慢自转
            if (planet) {
                planet.rotation.y += 0.002;
            }

            // 五层大气脉动（不同频率营造蓬松感）
            if (atmoInner) {
                const p = 1 + Math.sin(time * 1.8) * 0.02;
                atmoInner.scale.set(p, p, p);
                atmoInner.material.opacity = 0.14 + Math.sin(time * 1.5) * 0.03;
            }

            if (atmoMid) {
                const p = 1 + Math.sin(time * 1.5 + 0.5) * 0.025;
                atmoMid.scale.set(p, p, p);
                atmoMid.material.opacity = 0.09 + Math.sin(time * 1.2 + 0.3) * 0.02;
            }

            if (atmoOuter) {
                const p = 1 + Math.sin(time * 1.2 + 1) * 0.03;
                atmoOuter.scale.set(p, p, p);
            }

            if (haze) {
                const p = 1 + Math.sin(time * 1.0 + 1.5) * 0.035;
                haze.scale.set(p, p, p);
            }

            if (outermostHaze) {
                const p = 1 + Math.sin(time * 0.8 + 2) * 0.04;
                outermostHaze.scale.set(p, p, p);
            }

            // 雾霾粒子漂移
            if (hazeParticles && hazeData) {
                const posAttr = hazeParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = hazeData.baseAngles.length;

                for (let i = 0; i < n; i++) {
                    const angle = hazeData.baseAngles[i] + time * hazeData.driftSpeeds[i] * 0.05;
                    const lat = hazeData.latAngles[i] + Math.sin(time * 0.3 + hazeData.phases[i]) * 0.03;
                    const r = hazeData.radii[i] + Math.sin(time * 0.5 + hazeData.phases[i]) * 1.5;

                    arr[i * 3]     = r * Math.cos(lat) * Math.cos(angle);
                    arr[i * 3 + 1] = r * Math.sin(lat);
                    arr[i * 3 + 2] = r * Math.cos(lat) * Math.sin(angle);
                }
                posAttr.needsUpdate = true;
            }

            // 轨道粒子运动
            if (orbitParticles && orbitData) {
                const posAttr = orbitParticles.geometry.attributes.position;
                const arr = posAttr.array;
                const n = orbitData.semiMajors.length;

                for (let i = 0; i < n; i++) {
                    const ang = orbitData.baseAngles[i] + time * orbitData.speeds[i];
                    const a = orbitData.semiMajors[i];
                    const b = orbitData.semiMinors[i];
                    const inc = orbitData.inclinations[i];
                    const lon = orbitData.longitudes[i];

                    const cosA = Math.cos(ang);
                    const sinA = Math.sin(ang);
                    let x = a * cosA;
                    let z = b * sinA;
                    let y = 0;

                    const cosI = Math.cos(inc);
                    const sinI = Math.sin(inc);
                    const ny = y * cosI - z * sinI;
                    const nz = y * sinI + z * cosI;
                    y = ny; z = nz;

                    const cosL = Math.cos(lon);
                    const sinL = Math.sin(lon);
                    const nx = x * cosL - z * sinL;
                    const nz2 = x * sinL + z * cosL;
                    x = nx; z = nz2;

                    arr[i * 3]     = x;
                    arr[i * 3 + 1] = y;
                    arr[i * 3 + 2] = z;
                }
                posAttr.needsUpdate = true;
            }

            // 星空缓慢旋转
            if (starfield) starfield.rotation.y += 0.00015;

            controls.update();
            composer.render();
        }

        // ==========================================
        // 启动
        // ==========================================
        init();
        animate();

    </script>
</body>
</html>
